<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0910" />
    <!-- installable app: home-screen icon, full screen without the browser bar, content under the iPhone status bar -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TicketNest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="TicketNest" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="TicketNest — buy and sell K-pop concert tickets safely. Verified listings, KHQR payment, delivery through Telegram." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <title>TicketNest · K-pop concert tickets</title>
    <!-- link previews (Telegram, Facebook, Messenger). Concert links shared from the concert page use the
         API's /s/c/<slug> page instead, which shows that concert's poster, date and price. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TicketNest" />
    <meta property="og:title" content="TicketNest · K-pop concert tickets from fans to fans" />
    <meta property="og:description" content="Buy and sell K-pop concert tickets safely in Cambodia. Every listing is checked by our team, pay with KHQR, get your ticket on Telegram." />
    <meta property="og:image" content="https://ticketnest-web.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Telegram Mini App SDK (only active inside Telegram) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try { var t = localStorage.getItem('tn-theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
