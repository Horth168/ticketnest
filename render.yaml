# Render blueprint: Render dashboard -> New -> Blueprint -> pick this repository.
# Secrets are NOT stored here: every `sync: false` variable is typed into the Render dashboard.
services:
  # ---------------------------------------------------------------- API + Telegram bot + PayWay listener
  - type: web
    name: ticketnest-api
    runtime: python
    region: singapore
    plan: starter          # a paid plan never sleeps; the PayWay listener and bot need the API awake
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # ONE worker: the payment listener and the expiry job run inside the API process
    startCommand: alembic upgrade head && gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon / Render Postgres connection string
      - key: SITE_URL
        sync: false          # e.g. https://ticketnest-web.onrender.com
      - key: CORS_ORIGINS
        sync: false          # same as SITE_URL
      - key: API_PUBLIC_URL
        sync: false          # e.g. https://ticketnest-api.onrender.com
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_GROUP_ID
        sync: false
      - key: TELEGRAM_ADMIN_ID
        sync: false
      - key: TELEGRAM_SUPPORT_USERNAME
        sync: false
      - key: TELEGRAM_MINI_APP_URL
        sync: false
      - key: TELEGRAM_PAYMENT_GROUP_ID
        sync: false
      - key: TG_LISTENER_API_ID
        sync: false
      - key: TG_LISTENER_API_HASH
        sync: false
      - key: TG_LISTENER_SESSION
        sync: false
      - key: BAKONG_API_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STORAGE_PROVIDER
        value: r2            # Render's disk is wiped on every deploy, so files go to Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_PRIVATE_BUCKET
        sync: false

  # ---------------------------------------------------------------- website + /admin + /tg Mini App
  - type: web
    name: ticketnest-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://ticketnest-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
